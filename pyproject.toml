[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffgw"
version = "0.1.0"
description = "High-performance, batched, differentiable gravitational-wave modeling and inference engine in PyTorch (torchwave) and JAX (jaxwave)"
readme = "README.md"
authors = [
    { name = "Xan Morice-Atkinson" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "gravitational-waves",
    "pytorch",
    "jax",
    "differentiable",
    "astrophysics",
    "black-holes",
    "parameter-estimation",
]

[project.scripts]
torchwave-bench = "torchwave.benchmark:main"
torchwave-profile = "torchwave.profile:main"
torchwave-generate-qnm = "torchwave.qnm.generate:main"
torchwave-generate-london-qnm = "torchwave.qnm.london:main"
torchwave-data = "torchwave.external_data:main"
diffgw-bench = "torchwave.benchmark:main"
diffgw-profile = "torchwave.profile:main"
diffgw-generate-qnm = "torchwave.qnm.generate:main"
diffgw-generate-london-qnm = "torchwave.qnm.london:main"
diffgw-data = "torchwave.external_data:main"

[project.entry-points."pycbc.waveform.fd"]
torch_TaylorF2 = "torchwave.interfaces.pycbc:taylorf2_fd"
torch_IMRPhenomD = "torchwave.interfaces.pycbc:imrphenomd_fd"
torch_IMRPhenomXAS = "torchwave.interfaces.pycbc:imrphenomxas_fd"
torch_IMRPhenomXP = "torchwave.interfaces.pycbc:imrphenomxp_fd"
torch_IMRPhenomXHM = "torchwave.interfaces.pycbc:imrphenomxhm_fd"
torch_IMRPhenomXPHM = "torchwave.interfaces.pycbc:imrphenomxphm_fd"

[project.urls]
Repository = "https://github.com/xangma/diffgw"
Documentation = "https://xangma.github.io/diffgw/"
Issues = "https://github.com/xangma/diffgw/issues"

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
jax = [
    "jax>=0.4.28",
    "jaxlib>=0.4.28",
]
all = [
    "torch>=2.0.0",
    "jax>=0.4.28",
    "jaxlib>=0.4.28",
    "scipy>=1.8.0",
    "h5py>=3.0",
]
dev = [
    "pytest>=7.0.0",
    "scipy>=1.8.0",
    "ruff>=0.1.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.8.0",
]

qnm-generation = [
    "scipy>=1.8.0",
    "gmpy2>=2.2.0",
]

rom-official = [
    "h5py>=3.0",
]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
diffgw_core = ["data/*"]
torchwave = ["data/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E741",  # Ambiguous variable name 'l' (standard harmonic multipole index in gravitational wave physics)
    "E501",  # Line too long
    "E402",  # Module level import not at top of file
    "E701",  # Multiple statements on one line (colon)
    "E702",  # Multiple statements on one line (semicolon)
]

