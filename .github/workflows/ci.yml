name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  math-reference:
    name: Mathematical reference (CPU)
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install reference and both frontends
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e '.[reference,torch,jax,dev]'
      - name: Check generated reference artifacts
        run: |
          python -c "import importlib.metadata as m; print({name: m.version(name) for name in ('numpy', 'scipy', 'sympy', 'torch', 'jax', 'jaxlib')})"
          python -m diffgw_reference.artifacts --check
          python -m diffgw_reference.aligned_spin_artifacts --check
          python -m diffgw_reference.tidal_artifacts --check
          python -m diffgw_reference.spin_quadrupole_artifacts --check
          python -m diffgw_reference.traceability --check
          python -m diffgw_reference.aligned_spin_traceability --check
          python -m diffgw_reference.tidal_traceability --check
          python scripts/generate_waveform_library_table.py --check
          python scripts/generate_waveform_coverage.py --check
      - name: Verify reference agreement without qualification skips
        run: >-
          python -m pytest tests/test_waveform_definitions.py tests/test_*math_reference*.py
          --require-math-reference --reference-device=cpu -ra

  lal-oracles:
    name: LAL binary oracles (CPU)
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frontends and pinned binary oracle
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'jax[cpu]==0.4.29'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e '.[reference,torch,jax,dev]'
          python -m pip install 'lalsuite==7.21' 'numpy==1.26.4'
      - name: Verify oracle dependencies and waveform checks
        run: |
          python -c "import lal, lalsimulation, torch, jax, sympy; import importlib.metadata as m; print({name: m.version(name) for name in ('lalsuite', 'numpy', 'scipy', 'sympy', 'torch', 'jax', 'jaxlib')})"
          python -m pytest -q tests/test_imrphenomd_lal_gradients.py tests/test_taylorf2_lal_quadrupole.py tests/test_taylorf2_lal_tidal.py -ra

  test:
    name: "test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: "Step 1: Verify PyTorch without JAX"
        run: |
          pip install .[torch]
          pytest tests/test_diffgw.py tests/test_waveform_definitions.py

      - name: "Step 2: Verify JAX without PyTorch"
        run: |
          pip uninstall -y torch
          pip install .[jax]
          pytest tests/test_diffgw.py tests/test_waveform_definitions.py

      - name: "Step 3: Verify core suite with all and dev"
        run: |
          pip install .[all,dev]
          pytest tests/test_diffgw.py tests/test_waveform_definitions.py tests/test_mit_packaging.py tests/test_external_data.py tests/test_taylorf2_hm_external_api.py
