name: Pinned Oracle Parity Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  oracle-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Micromamba Environment
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: torchwave-oracle
          create-args: >-
            python=3.11
            pytorch-cpu
            python-lal=7.7.0
            python-lalsimulation=6.2.0
            pycbc=2.10.0
            pytest
            numpy
            scipy
          channels: conda-forge,pytorch

      - name: Verify Oracle Dependencies
        shell: bash -el {0}
        run: |
          python -c "import lal, lalsimulation, pycbc, torch; print('LAL:', lal.__version__, 'LALSim:', lalsimulation.__version__, 'PyCBC:', pycbc.__version__, 'Torch:', torch.__version__)"

      - name: Run Full Pytest Suite
        shell: bash -el {0}
        run: |
          PYTHONPATH=src pytest -v tests/

      - name: Execute Strict Parity Harness
        if: always()
        shell: bash -el {0}
        env:
          STRICT_PARITY: "1"
        run: |
          PYTHONPATH=src python tests/parity_harness.py --strict --json-out parity_results.json

      - name: Upload Parity Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-oracle-report
          path: parity_results.json
