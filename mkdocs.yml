site_name: DiffGW Documentation
site_description: Batched, differentiable gravitational-wave modeling in PyTorch (torchwave) and JAX (jaxwave)
site_url: https://xangma.github.io/diffgw/
repo_url: https://github.com/xangma/diffgw
repo_name: xangma/diffgw
copyright: Copyright &copy; 2024–2026 Xan Morice-Atkinson. MIT Licensed.

theme:
  name: material
  icon:
    logo: material/waveform
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - stylesheets/comparison.css
  - https://unpkg.com/katex@0/dist/katex.min.css

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            heading_level: 3
            docstring_style: google

hooks:
  - docs/hooks.py

validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: info

nav:
  - Start here:
      - Overview: index.md
      - Installation: installation.md
      - Quickstart: tutorials/01_quickstart_and_parity.md
  - Package comparison: comparison.md
  - Waveforms:
      - Waveform library: waveforms/index.md
      - Specification coverage: waveforms/coverage.md
      - Catalog and support: models.md
      - Component specification index: math/index.md
      - Specification template: math/waveform-spec-template.md
      - TaylorF2:
          - Nonspinning specification: math/taylorf2.md
          - Aligned spins: math/taylorf2-aligned-spin.md
          - Quadrupolar tides: math/taylorf2-tidal.md
          - Spin-induced quadrupoles: math/taylorf2-spin-quadrupole.md
          - Leading higher modes: math/taylorf2-hm.md
      - IMRPhenomD:
          - Intrinsic composition: math/imrphenomd-intrinsic.md
          - Amplitude and joins: math/imrphenomd-amplitude.md
          - Remnant and QNM inputs: math/imrphenomd-remnant-qnm.md
          - Phase and joins: math/imrphenomd-phase.md
          - Composed polarizations: math/imrphenomd-waveform.md
      - IMRPhenomHM frequency map: math/imrphenomhm-frequency-map.md
      - NRTidalv2 nonspinning phase: math/nrtidalv2-phase.md
      - NRTidalv2 amplitude and merger taper: math/nrtidalv2-amplitude-taper.md
      - Kerr 220 energy carrier: math/kerr-ringdown.md
      - Kerr angular projection: math/kerr-angular-projection.md
      - IMRPhenomXAS: math/imrphenomxas.md
      - Provisional research ledgers:
          - Higher-mode and tidal inspirals: waveforms/research/tidal-eccentric-higher-modes.md
          - Phenom higher modes: waveforms/research/phenom-higher-modes.md
          - Phenom precession: waveforms/research/phenom-precessing.md
          - PhenomXPNR evidence: waveforms/research/imrphenomxpnr.md
          - IMRPhenomT family: waveforms/research/imrphenomt-family.md
          - Standalone waveform family: math/standalone-family-research-ledger.md
          - EMRI prototype flux: math/emri-kludge.md
          - Dominant-pair memory: math/memory-dominant-22.md
          - ppE phase and dispersion: math/ppe-phase-dispersion.md
          - Retired prototype routes: waveforms/research/retired-release-surface.md
      - Parameters and conventions: conventions.md
      - Unit constants: math/units.md
      - IMRPhenomT family: imrphenomt.md
  - User guide:
      - Overview: usage.md
      - Waveform generation: guides/waveform-generation.md
      - Batching, devices and differentiation: guides/execution.md
      - Detectors and inference: guides/inference.md
      - Tutorials:
          - Fisher analysis: tutorials/02_fisher_analysis.md
          - NUTS API walkthrough: tutorials/03_parameter_estimation_nuts.md
  - Validation:
      - Evidence overview: validation.md
      - Differences from LAL: differences_from_lal.md
      - IMRPhenomT reference report: validation/phenomt.md
      - NRTidalv2 phase receipt: validation/nrtidalv2_phase_20260926.md
      - NRTidalv2 amplitude diagnostic: validation/nrtidalv2_amplitude_20260926.md
      - Inference checks: validation/inference.md
  - Performance:
      - Results overview: performance.md
      - "Package benchmarks": package_benchmarks.md
      - Running benchmarks: benchmarking_protocol.md
  - Reference:
      - API:
          - diffgw (unified): api/diffgw.md
          - torchwave (PyTorch): api/torchwave.md
          - jaxwave (JAX): api/jaxwave.md
      - Command-line tools: guides/cli.md
      - External datasets: external-data.md
      - Provenance and citations: provenance_ledger.md
