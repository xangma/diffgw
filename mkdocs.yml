site_name: DiffGW Documentation
site_description: Batched, differentiable gravitational-wave modeling in PyTorch (torchwave) and JAX (jaxwave)
site_url: https://xangma.github.io/diffgw/
repo_url: https://github.com/xangma/diffgw
repo_name: xangma/diffgw
copyright: Copyright &copy; 2024–2026 Xan Morice-Atkinson. MIT Licensed.

theme:
  name: material
  icon:
    logo: material/waveform
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            heading_level: 3
            docstring_style: google

hooks:
  - docs/hooks.py

validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: info

nav:
  - Home: index.md
  - Choose a Model:
      - Compare Packages: comparison.md
      - Model Support: models.md
  - User Guide:
      - Waveforms and Analysis: usage.md
      - IMRPhenomT Family: imrphenomt.md
      - External Datasets: external-data.md
  - Tutorials:
      - 1. Quickstart & Parity: tutorials/01_quickstart_and_parity.md
      - 2. Fisher Information: tutorials/02_fisher_analysis.md
      - 3. NUTS API Walkthrough: tutorials/03_parameter_estimation_nuts.md
  - Accuracy & Validation:
      - Evidence Overview: validation.md
      - IMRPhenomT Reference Report: validation/phenomt.md
      - Inference Checks: validation/inference.md
      - Mathematical Provenance: provenance_ledger.md
  - Performance:
      - Results Overview: performance.md
      - "21 Sep 2026: FP64 Waveforms": package_benchmarks.md
      - Reproduce & Methodology: benchmarking_protocol.md
  - API Reference:
      - diffgw (Unified): api/diffgw.md
      - torchwave (PyTorch): api/torchwave.md
      - jaxwave (JAX): api/jaxwave.md
